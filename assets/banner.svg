<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Glowing Blue/Cyan Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Accent Purple Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f355da" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.07)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Animations for Dynamic Aspect */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -80; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes rotate-mesh {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .node {
      transform-origin: center;
      animation: pulse 4s infinite ease-in-out;
    }
    .node-delay-1 { animation-delay: 1.3s; }
    .node-delay-2 { animation-delay: 2.6s; }

    .stream-line {
      stroke-dasharray: 20 10;
      animation: dash 5s linear infinite;
    }
    .stream-fast {
      stroke-dasharray: 15 5;
      animation: dash 2.5s linear infinite;
    }

    .floating-header {
      transform-origin: center;
      animation: float 6s infinite ease-in-out;
    }

    .mesh-bg {
      transform-origin: 400px 125px;
      animation: rotate-mesh 120s linear infinite;
      opacity: 0.15;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="250" fill="url(#bg-grad)" />

  <!-- Grid Overlay -->
  <rect width="800" height="250" fill="url(#grid)" />

  <!-- Dynamic Data Streams / Connecting Lines -->
  <g opacity="0.6">
    <path d="M-50,60 C150,40 250,180 450,100 C650,20 700,160 850,120" fill="none" stroke="url(#primary-grad)" stroke-width="1.5" class="stream-line" />
    <path d="M-50,180 C200,220 300,80 500,160 C700,240 750,100 850,80" fill="none" stroke="url(#accent-grad)" stroke-width="1" class="stream-fast" />
  </g>

  <!-- Animated Telecom Network Mesh Background -->
  <g class="mesh-bg">
    <!-- Network connections -->
    <line x1="300" y1="50" x2="400" y2="120" stroke="rgba(0,242,254,0.3)" stroke-width="0.7"/>
    <line x1="400" y1="120" x2="500" y2="70" stroke="rgba(0,242,254,0.3)" stroke-width="0.7"/>
    <line x1="500" y1="70" x2="480" y2="180" stroke="rgba(0,242,254,0.3)" stroke-width="0.7"/>
    <line x1="480" y1="180" x2="350" y2="190" stroke="rgba(0,242,254,0.3)" stroke-width="0.7"/>
    <line x1="350" y1="190" x2="400" y2="120" stroke="rgba(0,242,254,0.3)" stroke-width="0.7"/>
    <line x1="300" y1="50" x2="350" y2="190" stroke="rgba(0,242,254,0.3)" stroke-width="0.7"/>

    <!-- Network nodes -->
    <circle cx="300" cy="50" r="4" fill="#00f2fe" />
    <circle cx="400" cy="120" r="6" fill="#fff" />
    <circle cx="500" cy="70" r="4.5" fill="#f355da" />
    <circle cx="480" cy="180" r="5" fill="#00f2fe" />
    <circle cx="350" cy="190" r="4" fill="#7000ff" />
  </g>

  <!-- Glowing Foreground Nodes -->
  <g filter="url(#glow)">
    <circle cx="150" cy="90" r="5" fill="#00f2fe" class="node" />
    <circle cx="650" cy="160" r="6" fill="#f355da" class="node node-delay-1" />
    <circle cx="280" cy="180" r="4" fill="#fff" class="node node-delay-2" />
    <circle cx="520" cy="60" r="5.5" fill="#00f2fe" class="node node-delay-1" />
  </g>

  <!-- Text Content Group with floating animation -->
  <g class="floating-header" filter="url(#glow)">
    <!-- Subtitle / Category -->
    <text x="400" y="95" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#00f2fe" letter-spacing="4" text-anchor="middle">AWESOME TELECOM OBSERVABILITY</text>
    
    <!-- Title -->
    <text x="400" y="145" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="2" text-anchor="middle">
      5G Network Analytics
    </text>
    
    <!-- Decorative underline -->
    <rect x="300" y="165" width="200" height="2" fill="url(#primary-grad)" rx="1" />
    
    <!-- Dynamic Accent dot -->
    <circle cx="508" cy="166" r="3" fill="#f355da" class="node" />
  </g>
</svg>
